a1.sources = r1
a1.channels = c1
a1.sinks = k1


a1.sources.r1.type = com.wenchen.flume.CustomSource
a1.sources.r1.kafka.topic = users
# Kafka 地址通过启动参数注入：flume-ng agent ... -Dkafka.broker=<host:port>
a1.sources.r1.kafka.broker = ${kafka.broker}

a1.channels.c1.type = memory
a1.channels.c1.capacity = 10000
a1.channels.c1.transactionCapacity = 1000


a1.sinks.k1.type = hdfs
a1.sinks.k1.channel = c1

a1.sinks.k1.hdfs.path = ${hdfs.namenode}/flume/logs/%Y-%m-%d/%H

a1.sinks.k1.hdfs.fileSystemURI = ${hdfs.namenode}

a1.sinks.k1.hdfs.filePrefix = log
a1.sinks.k1.hdfs.fileSuffix = .log
a1.sinks.k1.hdfs.round = true
a1.sinks.k1.hdfs.roundValue = 1
a1.sinks.k1.hdfs.roundUnit = minute
a1.sinks.k1.hdfs.useLocalTimeStamp = true


a1.sinks.k1.hdfs.writeFormat = Text
a1.sinks.k1.hdfs.serializer = text
a1.sinks.k1.hdfs.batchSize = 1000
a1.sinks.k1.hdfs.rollSize = 134217728
a1.sinks.k1.hdfs.rollInterval = 60
a1.sinks.k1.hdfs.rollCount = 0



a1.sources.r1.channels = c1
a1.sinks.k1.channel = c1
