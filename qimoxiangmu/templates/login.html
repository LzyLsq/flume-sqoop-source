<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/js/all.min.js"></script>
    <link rel="stylesheet" href="../static/js/loginstyle.css">
    <title>登录和注册</title>
</head>
<body>
<div class="container">
    <div class="forms-container">
        <div class="signin-signup">
            <form action="#" class="sign-in-form" id="loginForm">
                <h2 class="title">登录</h2>
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="用户名" name="username" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="密码" name="password" required>
                </div>
                <input type="submit" value="登录" class="btn solid">
                <p class="social-text">或使用社交平台登录</p>
                <div class="social-media">
                    <a href="https://im.qq.com" class="social-icon">
                        <i class="fab fa-qq"></i>
                    </a>
                    <a href="https://www.wechat.com" class="social-icon">
                        <i class="fab fa-weixin"></i>
                    </a>
                    <a href="https://weibo.com" class="social-icon">
                        <i class="fab fa-weibo"></i>
                    </a>
                    <a href="https://www.alipay.com" class="social-icon">
                        <i class="fab fa-alipay"></i>
                    </a>
                </div>
            </form>
            <form action="#" class="sign-up-form">
                <h2 class="title">注册</h2>
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" placeholder="用户名" name="username" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-envelope"></i>
                    <input type="email" placeholder="电子邮件" name="email" required>
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" placeholder="密码" name="password" required>
                </div>
                <input type="submit" class="btn" value="注册">
                <p class="social-text">或使用社交平台注册</p>
                <div class="social-media">
                    <a href="https://im.qq.com" class="social-icon">
                        <i class="fab fa-qq"></i>
                    </a>
                    <a href="https://www.wechat.com" class="social-icon">
                        <i class="fab fa-weixin"></i>
                    </a>
                    <a href="https://weibo.com" class="social-icon">
                        <i class="fab fa-weibo"></i>
                    </a>
                    <a href="https://www.alipay.com" class="social-icon">
                        <i class="fab fa-alipay"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>
    <div class="panels-container">
        <div class="panel left-panel">
            <div class="content">
                <h3>新用户？</h3>
              <p>
                    你可以在此处注册一个新账号。
                </p>
                <button class="btn transparent" id="sign-up-btn">
                    注册
                </button>
            </div>
            <img src="/static/chahua1.png" class="image" alt="" />
        </div>
        <div class="panel right-panel">
            <div class="content">
                <h3>已有账号？</h3>
                <p>
                    如果你已经有账号，可以在此处登录。
                </p>
                <button class="btn transparent" id="sign-in-btn">
                    登录
                </button>
            </div>
            <img src="/static/chahua2.png" class="image" alt="" />
        </div>
    </div>
</div>
<script src="../static/js/login.js"></script>
</body>
</html>
