<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时订单统计</title>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.3.2/dist/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-image: url('/static/background.png');
            background-size: cover; /* 覆盖整个元素 */
            background-position: center; /* 居中显示 */
            background-attachment: fixed; /* 固定背景，不随滚动条滚动 */
            display: flex;
            background-color: rgba(0, 0, 0, 0.5); /* 半透明黑色背景 */
            z-index: -1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            position: relative; /* 添加相对定位 */
        }
        body.light-mode {
            background-color: #16213e; /* 蓝色背景 */
            color: #000000; /* 黑色文字 */
            background-image: url('/static/background.png');
            background-size: cover; /* 覆盖整个元素 */
            background-position: center; /* 居中显示 */
            background-attachment: fixed;
        }
        body.dark-mode {
            background-color: #16213e; /* 蓝色背景 */
            color: #000000; /* 黑色文字 */
            background-image: url('/static/background-dark1.jpg');
            background-size: cover; /* 覆盖整个元素 */
            background-position: center; /* 居中显示 */
            background-attachment: fixed; /* 固定背景，不随滚动条滚动 */
        }

        h1 {
            color: #fff; /* 字体颜色 */
            font-size: 3.5VW; /* 字体大小 */
            text-align: center; /* 文本居中对齐 */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5), 0 0 10px rgba(0, 255, 255, 0.3); /* 多层次文字阴影 */
            background-image: linear-gradient(45deg, rgba(0, 255, 255, 0.3), rgba(255, 0, 255, 0.3)); /* 渐变背景 */
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: neon 2s infinite alternate;
            margin: 2VW 0; /* 上下边距 */
            font-weight: bold; /* 字体加粗 */
            letter-spacing: 0.1VW; /* 字符间距 */
            word-spacing: 0.2VW; /* 单词间距 */
            text-transform: uppercase; /* 文本大写 */
        }
        body.dark-mode h1{
            color: #fff; /* 字体颜色 */
        }

        @keyframes neon {
            from {
                text-shadow: 0 0 5px rgba(0, 255, 255, 0.5), 0 0 10px rgba(0, 255, 255, 0.3), 0 0 20px rgba(0, 255, 255, 0.7);
            }
            to {
                text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 30px rgba(0, 255, 255, 1);
            }
        }
        #timeDisplay {
            color: #fff; /* 字体颜色 */
            font-size: 1VW; /* 字体大小 */
            text-align: center; /* 文本居中对齐 */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5), 0 0 10px rgba(0, 255, 255, 0.3); /* 多层次文字阴影 */
            background-image: url('/static/border2.png'), linear-gradient(45deg, rgba(0, 255, 255, 0.3), rgba(255, 0, 255, 0.3)); /* 保留背景图片，并添加渐变背景 */
            background-size: cover; /* 背景图片覆盖整个元素 */
            background-position: center; /* 背景图片居中显示 */
            padding: 0.5VW; /* 内边距 */
            border-radius: 10%; /* 边框圆角 */
            position: absolute;
            top: 10VW; /* 距离顶部120px */
            width: 100%; /* 宽度占满整个容器 */
            display: flex;
            justify-content: center; /* 内容水平居中 */
            align-items: center; /* 内容垂直居中 */
            animation: neon 2s infinite alternate;
        }
        body.dark-mode #timeDisplay{
            color: #000000;
            background-image: url('/static/border.png'), linear-gradient(45deg, rgba(0, 255, 255, 0.3), rgba(255, 0, 255, 0.3));
        }
        @keyframes neon {
            from {
                text-shadow: 0 0 5px rgba(0, 255, 255, 0.5), 0 0 10px rgba(0, 255, 255, 0.3), 0 0 20px rgba(0, 255, 255, 0.7);
            }
            to {
                text-shadow: 0 0 10px rgba(0, 255, 255, 0.8), 0 0 20px rgba(0, 255, 255, 0.6), 0 0 30px rgba(0, 255, 255, 1);
            }
        }
        .top-container {
            position: absolute;
            top: 0;
            width: 40%;
            padding: 40px 0; /* 上下内边距 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: -1;
        }

        .charts-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 10;



        }
        .chart {
            position: absolute;
            width: 20%;
            height: 30%;
            background-image: url('/static/border3.png');
            background-size: cover; /* 确保图片覆盖整个图表 */
            background-position: center; /* 将图片居中显示 */
        //*background-clip: border-box; /* 裁剪背景图片，使其覆盖边框区域 */
        border: 10px solid transparent;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5); /* 添加阴影效果 */
            border-radius: 8px;
            padding: 10px;
            z-index: 10;
        }
        #chart1 { top: 15%; left: 15%; transform: translateX(-50%); }
        #chart2 { top: 15%; left: 85%; transform: translateX(-50%);}
        #chart3 { top: 55%; left: 15%; transform: translateX(-50%);}
        #chart5 { top: 55%; left: 85%; transform: translateX(-50%); }
        #chart4 { bottom: 0; left: 50%; transform: translateX(-50%); width: 40%; height: 18%;}
        @media (max-width: 768px) {
            .chart {
                width: 150px;
                height: 150px;

            }
        }
        body.dark-mode .chart {
            background-image: url('/static/bordernight.jpg');
            border: 10px solid transparent;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            background-clip: border-box;
            padding: 10px;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #f0f0f0;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s;
            z-index: 100;
        }
        .theme-toggle:hover {
            background-color: #e0e0e0;
        }
        .theme-toggle img {
            width: 30px;
            height: 30px;
        }
        #loading {
            position: fixed;
            top: 5%;
            left: 20%;
            transform: translate(-50%, -50%);
            display: block;

        }
        /* 美化加载指示器 */
        #loading img {
            width: 20%; /* 设置图片大小 */
            height: auto; /* 保持图片比例 */
        }
        /* #updateNotification {
              display: none;
              background-color: #28a745;
              color: white;
              padding: 10px;
              text-align: center;
              position: fixed;
              top: 0;
              width: 100%;
              z-index: 9999;
          }*/
        /* select {
             margin-top: 20px;
             padding: 10px;
             font-size: 16px;
         }*/

        /* canvas {
             display: block;
         }*/
        .renderer-border {
            border: 0 solid transparent; /* 设置边框宽度和颜色 */
            padding: 1.5%; /* 移除内边距 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1); /* 添加阴影效果 */
            background: url('/static/border3.png') no-repeat; /* 设置边框图片 */
            /* background-clip: content-box; /* 裁剪背景和边框，确保背景只显示在canvas区域内*/
            background-size: 100% 100%;
            position: absolute; /* 绝对定位 */
            top: 50%; /* 垂直居中 */
            left: 50%; /* 水平居中 */
            transform: translate(-50%, -50%); /* 调整位置 */
            z-index: 10; /* 确保渲染器在图表之下 */
            border-radius: 60px; /* 增加边框圆角 */
        }
        body.dark-mode .renderer-border{
            border: 0 solid transparent;
            /* padding: 1.5%; /* 移除内边距 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 1); /* 添加阴影效果 */
            background: url('/static/bordernight.jpg') no-repeat;
            background-size: 100% 105%;
            position: absolute; /* 绝对定位 */
            top: 50%; /* 垂直居中 */
            left: 50%; /* 水平居中 */
            transform: translate(-50%, -50%); /* 调整位置 */
            z-index: 10; /* 确保渲染器在图表之下 */
            border-radius: 60px; /* 增加边框圆角 */
        }


        #earthContainer {
            /* background-color:#28a745;*/
            top: 100%;
            left: 100%;
            z-index: 10;
            overflow: hidden; /* 防止地球效果溢出容器 */

        }
        #rendererText {
            position: absolute;
            top: 25%;
            left: 48%;
            color: #000000;
            font-size: 1VW; /* 字体大小 */
            text-align: left; /* 文本左对齐 */
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5), 0 0 10px rgba(0, 255, 255, 0.3); /* 文字阴影 */
            z-index: 1001;
        }
        body.dark-mode #rendererText{
            color: #28a745; /* 字体颜色 */
        }

    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">
    <img id="themeIcon" src="/static/son.png" alt="切换主题" >
</button>

<div id="loading">
    <img src="/static/load2.gif" alt="loading...">
</div>



<div class="top-container">
    <h1 data-text="实时订单统计">实时订单统计</h1>
    <div id="timeDisplay"></div>
</div>




<div class="charts-container">
    <div class="chart" id="chart1"></div> <!-- 总有效/无效数量 -->
    <div class="chart" id="chart2"></div> <!-- 每个订单号有效/无效数量 -->
    <div class="chart" id="chart3"></div> <!-- 每个订单类别数量 -->
    <div class="chart" id="chart4"></div> <!-- 不同类别商品有效/无效数量 -->
    <div class="chart" id="chart5"></div> <!-- 各类别有效/无效比例 -->
</div>

<div id="earthContainer">
    <div id="rendererText">地球窗口</div>
</div>
<script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setClearColor(0xFFFFFF,0);
    renderer.setSize(window.innerWidth/2.5, window.innerHeight/2.5);
    //renderer.domElement.classList.add('renderer-border');
    document.body.appendChild(renderer.domElement);
    const style = renderer.domElement.style;
    const canvas = renderer.domElement;
    canvas.classList.add('renderer-border');
    document.body.appendChild(canvas);

    //const textureLoader = new THREE.TextureLoader();
    //const earthTexture = textureLoader.load('/static/earth5.jpg');
    const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
    /* const earthMaterial = new THREE.MeshStandardMaterial({
         map: earthTexture,
         roughness: 0.7,
         metalness: 0.3
     });*/

    let currentEarthTexturePath = '/static/earth5.jpg'; // 默认亮模式纹理路径
    const textureLoader = new THREE.TextureLoader();

    function updateEarthTexture() {
        if (document.body.classList.contains('dark-mode')) {
            currentEarthTexturePath = '/static/earth2.jpg';
        } else {

            currentEarthTexturePath = '/static/earth5.jpg';
        }
        const earthTexture = textureLoader.load(currentEarthTexturePath);
        earth.material.map = earthTexture;
        earth.material.needsUpdate = true;
    }
    const earthTexture = textureLoader.load(currentEarthTexturePath);
    const earthMaterial = new THREE.MeshStandardMaterial({
        map: earthTexture,
        roughness: 0.7,
        metalness: 0.3
    });

    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    earth.position.set(0, 0, 0);
    scene.add(earth);

    const satellites = [];
    const satelliteCount = 200;
    for (let i = 0; i < satelliteCount; i++) {
        const satelliteGeometry = new THREE.SphereGeometry(0.05, 32, 32);

        const color = new THREE.Color();
        color.setHSL(Math.random(), 0.75, 0.5); // 使用HSL颜色空间生成随机颜色，其中饱和度和亮度固定

        const satelliteMaterial = new THREE.MeshStandardMaterial({ color: color });
        const satellite = new THREE.Mesh(satelliteGeometry, satelliteMaterial);

        // 随机轨道半径
        const orbitRadius = 3+Math.random() * 10; // 轨道半径在2到12之间随机
        // 随机方位角
        const theta = Math.random() * Math.PI * 4;
        // 随机极角
        const phi = Math.acos(Math.random() * 2 - 1);

        satellite.position.x = orbitRadius * Math.sin(phi) * Math.cos(theta);
        satellite.position.y = orbitRadius * Math.sin(phi) * Math.sin(theta);
        satellite.position.z = orbitRadius * Math.cos(phi);

        scene.add(satellite);
        satellites.push(satellite);
    }

    /*const starFieldGeometry = new THREE.PlaneGeometry(window.innerWidth, window.innerHeight);
    const starFieldMaterial = new THREE.MeshBasicMaterial({ map: starFieldTexture, side: THREE.DoubleSide });
    const starField = new THREE.Mesh(starFieldGeometry, starFieldMaterial);
    starField.position.z = -5; // 将平面放置在相机的后方
    scene.add(starField);*/

    const particleGeometry = new THREE.BufferGeometry();
    const particleMaterial = new THREE.PointsMaterial({
        color: 0x00ffff, size: 0.05, blending: THREE.AdditiveBlending, transparent: true
    });

    const particles = [];
    for (let i = 0; i < 1000; i++) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        const r = 1.05; // 半径略大于地球
        particles.push(
            r * Math.sin(phi) * Math.cos(theta),
            r * Math.sin(phi) * Math.sin(theta),
            r * Math.cos(phi)
        );
    }
    particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(particles, 3));
    const particlePoints = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particlePoints);
    //星空背景点云
    const starGeometry = new THREE.BufferGeometry();
    const stars = [];
    const starCount = 50000;
    const maxDistance = 1000; // 最大距离

    for (let i = 0; i < starCount; i++) {
        const theta = Math.random() * Math.PI * 2; // 0到2π之间，方位角
        const phi = Math.acos(Math.random() * 2 - 1); // -1到1之间，生成-π/2到π/2之间的角度，覆盖整个上半球和下半球
        const r = maxDistance * Math.random()*0.1; // 星星距离原点的距离，最大为maxDistance

        const x = r * Math.sin(phi) * Math.cos(theta);
        const y = r * Math.sin(phi) * Math.sin(theta);
        const z = r * Math.cos(phi);

        stars.push(x, y, z);

    }

    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(stars, 3));
    const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.005,
        transparent: true,
        opacity: 0.9
    });
    const starField = new THREE.Points(starGeometry, starMaterial);
    scene.add(starField);

    const earthRadius = 1;
    const flowLines = [];
    const curveMaterial = new THREE.LineBasicMaterial({ color: 0xffa500, opacity: 0.8, transparent: true });
    const fixedPoints = [
        new THREE.Vector3(earthRadius, 0, 0),
        new THREE.Vector3(0, earthRadius, 0),
        new THREE.Vector3(0, 0, earthRadius)
    ];
    function createFlowLine() {
        const point1 = getRandomPositionOnSphere(1.02);
        const point2 = getRandomPositionOnSphere(1.02);
        const point3 = getRandomPositionOnSphere(1.02);
        const point4 = getRandomPositionOnSphere(1.02);

        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(...point1),
            new THREE.Vector3(...point2),
            new THREE.Vector3(...point3),
            new THREE.Vector3(...point4),



        ]);
        const points = curve.getPoints(100);
        //const tubeGeometry = new THREE.TubeGeometry(curve, 64, 0.05, 8, false);

        const geometry = new THREE.BufferGeometry().setFromPoints(points);



        const line = new THREE.Line(geometry, curveMaterial);
        scene.add(line);

        flowLines.push({ line, points, index: 0 });
    }

    function getRandomPositionOnSphere(radius) {
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);
        return [
            radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.sin(phi) * Math.sin(theta),
            radius * Math.cos(phi)
        ];
    }

    fixedPoints.forEach(point => {
        for (let i = 0; i < 20; i++) createFlowLine(point);
    });

    function updateFlowLines() {
        flowLines.forEach((flow) => {
            const { line, points, index } = flow;

            const visiblePoints = points.slice(index, index + 12);
            const geometry = new THREE.BufferGeometry().setFromPoints(visiblePoints);
            line.geometry.dispose();
            line.geometry = geometry;

            const progress = index / points.length;
            const color = new THREE.Color().setHSL(progress, 1.0, 0.5); // HSL颜色渐变
            line.material.color.set(color);
            line.material.opacity = 0.8 - progress * 0.6;
            flow.index = (index + 0.5) % points.length;
        });
    }

    function updateParticles() {
        const radius = 1.15;

        particleGeometry.attributes.position.array.forEach((_, index) => {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const x = radius * Math.sin(phi) * Math.cos(theta);
            const y = radius * Math.sin(phi) * Math.sin(theta);
            const z = radius * Math.cos(phi);

            particleGeometry.attributes.position.setXYZ(index, x, y, z);
        });

        particleGeometry.attributes.position.needsUpdate = true;
    }
    const ambientLight = new THREE.AmbientLight(0xffffff, 2);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 3);
    pointLight.position.set(1, 1, 1);
    scene.add(pointLight);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth/2.5, window.innerHeight/2.5);
    });


    window.addEventListener('click', () => {
        createFlowLine();
    });

    const satelliteStates = [];
    satellites.forEach((satellite, index) => {
        const orbitRadius = 2 + index * 2;
        satelliteStates.push({
            orbitRadius,
            angle: Math.random() * Math.PI * 2,
            angleSpeed: 0.001 + (index * 0.0005)
        });
    });

    function animate() {
        requestAnimationFrame(animate);

        earth.rotation.y += 0.001;
        earth.rotation.x += 0.0005;
        earth.rotation.z += 0.0005;

        satelliteStates.forEach((state, index) => {
            const { orbitRadius, angle, angleSpeed } = state;
            const newAngle = angle + angleSpeed; // 更新角度


            satellites[index].position.x = orbitRadius * Math.cos(newAngle);
            satellites[index].position.y = orbitRadius * Math.sin(newAngle);
            satellites[index].position.z = 0; // 保持在XY平面上

            state.angle = newAngle; // 更新状态
        });


        starField.rotation.y -= 0.0001;

        particlePoints.rotation.y += 0.001;

        updateFlowLines();
        updateParticles();
        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    window.onerror = function(message, source, lineno, colno, error) {
        console.error("JavaScript 错误:", message, "来源:", source, "行号:", lineno, "列号:", colno);
    };

    // WebSocket连接
    // 同源连接：不写死 IP/端口，页面部署在哪就自动连哪（Nginx 反代 80 -> Flask）
    var socket = io.connect(window.location.origin);
    socket.on('connect', function() {
        console.log("WebSocket 已连接");
        document.getElementById('loading').style.display = 'none';
    });

    socket.on('disconnect', function() {
        console.warn("WebSocket 已断开");
        document.getElementById('loading').style.display = 'block';
        setTimeout(() => {
            console.log("尝试重连 WebSocket...");
            socket.connect(); // 重连机制
        }, 5000);
    });

    socket.on('error', function(error) {
        console.error("WebSocket 错误：", error);
    });

    // 图表初始化
    function initializeChart(id, options) {
        const chart = echarts.init(document.getElementById(id));
        chart.setOption(options);
        return chart;
    }

    var chart1 = initializeChart('chart1', {
        title: {
            text: '1.所有有效和无效订单数量总和',
            textStyle: {
                color: '#fff',
                fontSize: '2vw', // 字体大小保持不变
                fontWeight: 'bold',
                fontFamily: 'Arial',
                shadowColor: 'rgba(0, 255, 255, 0.5)',
                shadowBlur: 10,
                shadowOffsetX: 4,
                shadowOffsetY: 4,
                textBorderColor: 'rgba(0, 255, 255, 0.5)', // 文字描边颜色
                textBorderWidth: 1 // 文字描边宽度
            },
            emphasis: { // 鼠标悬停时的高亮效果
                textStyle: {
                    color: '#ff0', // 高亮颜色
                    shadowBlur: 0 // 取消阴影
                }
            }
        },
        tooltip: {
            trigger: 'axis',
            axisPointer: {
                type: 'shadow' // 鼠标悬浮时的指示器类型
            }
        },
        xAxis: {
            type: 'category',
            data: ['有效', '无效'],
            axisLabel: {
                fontSize: 5,
                color: '#00D1FF', // 蓝色，科技感
                fontWeight: 'bold' // 字体加粗
            },
            axisLine: {
                lineStyle: {
                    color: '#00D1FF', // 蓝色，科技感
                }
            }
        },
        yAxis: {
            type: 'value',
            axisLabel: {
                fontSize: 5,
                color: '#00D1FF', // 蓝色，科技感
                fontWeight: 'bold' // 字体加粗
            },
            axisLine: {
                lineStyle: {

    socket.on('update_data', function(data) {
        console.log("收到服务器推送数据：", data);

        // 处理数据
        var orderIds = Object.keys(data.order_number_stats);
        var validCounts = orderIds.map(id => data.order_number_stats[id].Y);
        var invalidCounts = orderIds.map(id => data.order_number_stats[id].N);

        var categories = Object.keys(data.order_category_stats);
        var categoryCounts = categories.map(category =>
            data.order_category_stats[category].Y + data.order_category_stats[category].N
        );

        var validCountsByCategory = categories.map(category => data.order_category_stats[category].Y);
        var invalidCountsByCategory = categories.map(category => data.order_category_stats[category].N);

        var pieData = categories.map(category => ({
            name: category,
            value: data.order_category_stats[category].Y + data.order_category_stats[category].N
        }));

        chart1.setOption({
            series: [{ data: [data.order_stats.valid, data.order_stats.invalid] }]
        });

        chart2.setOption({
            xAxis: { data: orderIds },
            series: [
                { name: '有效', data: validCounts },
                { name: '无效', data: invalidCounts }
            ]
        });

        chart3.setOption({
            xAxis: { data: categories },
            series: [{ data: categoryCounts }]
        });

        chart4.setOption({
            xAxis: { data: categories },
            series: [
                { name: '有效', data: validCountsByCategory },
                { name: '无效', data: invalidCountsByCategory }
            ]
        });

        chart5.setOption({
            series: [{ data: pieData }]
        });
