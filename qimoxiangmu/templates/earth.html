<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"="width=device-width, initial-scale=1.0">
  <title>电商统计3D地球效果</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      background-image: url('/static/background.png');
      background-size: cover;
      background-position: center;
    }

    canvas {
      display: block;
    }

    .renderer-border {
      border: 8px solid transparent;
      padding: 0;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
      background: url('/static/border.png') no-repeat;
      background-clip: content-box;
      background-size: 100% 100%;
    }

    #chart-container {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<div id="chart-container" style="width: 100%; height: 100%;"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>

<script>
  // 初始化场景、相机、渲染器
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 2, 5);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setClearColor(0x0000ff, 0);
  renderer.setSize(window.innerWidth, window.innerHeight);
  const canvas = renderer.domElement;
  canvas.classList.add('renderer-border');
  document.body.appendChild(canvas);

  // 地球相关设置
  const textureLoader = new THREE.TextureLoader();
  const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
  const earthMaterial = new THREE.MeshStandardMaterial({
    map: textureLoader.load('/static/earth5.jpg'),
    roughness: 0.7,
    metalness: 0.3
  });
  const earth = new THREE.Mesh(earthGeometry, earthMaterial);
  scene.add(earth);

  // 航线对象池
  const routePool = [];

  // 从对象池获取航线对象
  function getRouteFromPool() {
    return routePool.length > 0? routePool.pop() : null;
  }

  // 将航线对象归还到对象池
  function returnRouteToPool(route) {
    routePool.push(route);
    route.visible = false;
  }

  // 创建渐变材质函数
  function createGradientLineMaterial() {
    const vertexShader = `
        varying vec3 vPosition;

        void main() {
          vPosition = position;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `;

    const fragmentShader = `
        varying vec3 vPosition;
        uniform vec3 startColor;
        uniform vec3 endColor;

        void main() {
          // 根据顶点位置计算颜色插值因子
          float factor = (vPosition.z + 1.0) / 2.0;
          vec3 color = mix(startColor, endColor, factor);
          gl_FragColor = vec4(color, 1.0);
        }
      `;

    const material = new THREE.ShaderMaterial({
      uniforms: {
        startColor: { value: new THREE.Color(0x0000ff) }, // 起始颜色
        endColor: { value: new THREE.Color(0xffff00) } // 结束颜色
      },
      vertexShader: vertexShader,
      fragmentShader: fragmentShader,
      transparent: true,
      linewidth: 5
    });

    return material;
  }

  // 将经纬度转换为地球上的三维坐标，并向外偏移一定距离
  function get3DCoordWithOffset(lon, lat, offset) {
    const phi = lat * Math.PI / 180;
    const theta = (lon + 180) * Math.PI / 180;
    const radius = 1 + offset; // 地球半径加上偏移量

    const x = radius * Math.sin(phi) * Math.cos(theta);
    const y = radius * Math.sin(phi) * Math.sin(theta);
    const z = radius * Math.cos(phi);

    return new THREE.Vector3(x, y, z);
  }

  // 创建抛物线路径
  function createParabolicPath(startCoord, endCoord) {
    const points = [];
    const x1 = startCoord.x;
    const y1 = startCoord.y;
    const z1 = startCoord.z;
    const x2 = endCoord.x;
    const y2 = endCoord.y;
    const z2 = endCoord.z;

    // 计算抛物线系数
    const a = (z2 - z1) / ((x2 - x1) * (x2 - x1));

    for (let t = 0; t <= 1; t += 0.01) {
      const x = x1 + t * (x2 - x1);
      const z = a * (x - x1) * (x - x1) + z1;
      const y = y1 + t * (y2 - y1);
      points.push(new THREE.Vector3(x, y, z));
    }

    const geometry = new THREE.BufferGeometry().setFromPoints(points);
    return geometry;
  }

  // 创建
  function createRoute(geometry) {
    let line = getRouteFromPool();
    if (!line) {
      const lineMaterial = createGradientLineMaterial();
      line = new THREE.Line(geometry, lineMaterial);
      scene.add(line);
    } else {
      line.geometry = geometry;
      line.material = line.material;
      line.visible = true;
    }
    return line;
  }

  // 加载航班数据并创建航线
  function createRoutes() {
    $.getJSON('/static/flights.json', function (data) {
      // 随机选取 5 - 6 条航线绘制（可根据实际需求调整）
      const numRoutesToDraw = 5 + Math.floor(Math.random() * 2);
      const indices = [];
      while (indices.length < numRoutesToDraw) {
        const randomIndex = Math.floor(Math.random() * data.routes.length);
        if (!indices.includes(randomIndex)) {
          indices.push(randomIndex);
        }
      }

      indices.forEach((index) => {
        var route = data.routes[index];
        var startAirport = data.airports[route[1]];
        var endAirport = data.airports[route[2]];
        var startCoord = get3DCoordWithOffset(startAirport[3], startAirport[4], 0.1);
        var endCoord = get3DCoordWithOffset(endAirport[3], endAirport[4], 0.1);
        var geometry = createParabolicPath(startCoord, endCoord);
        createRoute(geometry);
      });
    });
  }

  // 光源设置
  const ambientLight = new THREE.AmbientLight(0xffffff, 2);
  scene.add(ambientLight);
  const pointLight = new THREE.PointLight(0xffffff, 2);
  pointLight.position.set(1.5, 1.5, 1.5);
  scene.add(pointLight);

  // 交互控件设置
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // 全局变量，用于控制闪烁频率
  let blinkFrequency = 0.02;
  let blinkOpacity = 0.8;

  // 屏幕自适应函数
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // 动画循环函数
  function animate() {
    requestAnimationFrame(animate);

    // 控制航线闪烁
    blinkOpacity += blinkFrequency;
    if (blinkOpacity >= 1.0 || blinkOpacity <= 0.6) {
      blinkFrequency = -blinkFrequency;
    }

    scene.children.forEach(child => {
      if (child instanceof THREE.Line) {
        child.material.opacity = blinkOpacity;
      }
    });

    controls.update();
    renderer.render(scene, camera);
  }

  // 在合适的地方，比如场景切换或数据更新时，清理对象池
  function clearRoutePool() {
    routePool.forEach(route => {
      scene.remove(route);
    });
    routePool.length = 0;
  }

  // 启动动画循环以及创建航线
  animate();
  createRoutes();
</script>
</body>

</html>
